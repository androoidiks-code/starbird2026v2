<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Bird: Lucky Spin 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --yellow: #fcd34d; --blue: #3b82f6; --sky: #0ea5e9; --red: #f43f5e; --dark: #020617; --card: #1e293b; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 10px; padding-bottom: 80px; overflow-x: hidden; touch-action: manipulation; user-select: none; }
        
        .header-panel { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; padding: 15px; margin-bottom: 8px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 22px; font-weight: 800; color: var(--yellow); text-shadow: 0 0 10px rgba(252, 211, 77, 0.3); }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .progress-container { background: #1e293b; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; border: 1px solid #334155; position: relative; }
        #progress-bar { background: var(--blue); width: 0%; height: 100%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--blue); }
        .progress-text { font-size: 9px; color: white; position: absolute; width: 100%; top: 0; left: 0; line-height: 12px; font-weight: bold; }

        #scene { position: relative; width: 100%; height: 260px; background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 100%); border-radius: 24px; overflow: hidden; margin-bottom: 10px; border: 4px solid #1e293b; box-shadow: inset 0 0 50px rgba(0,0,0,0.2); }
        #bird-wrap { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); z-index: 10; transition: top 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        #bird { font-size: 55px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); display: inline-block; animation: wing 0.4s infinite alternate; }
        @keyframes wing { from { transform: scaleX(-1) rotate(-8deg); } to { transform: scaleX(-1) rotate(8deg); } }
        
        #multiplier { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: var(--yellow); border: 1px solid var(--yellow); display: none; z-index: 20; }
        #gain-float { position: absolute; right: 20px; top: 20px; color: var(--yellow); font-weight: bold; font-size: 20px; display: none; z-index: 25; }

        .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 5px; }
        .btn { padding: 12px; border: none; border-radius: 18px; font-weight: bold; color: white; cursor: pointer; transition: 0.1s; border-bottom: 5px solid rgba(0,0,0,0.3); font-size: 11px; text-transform: uppercase; }
        .btn:active:not(:disabled) { transform: translateY(3px); border-bottom: none; }
        .btn:disabled { background: #334155 !important; color: #94a3b8; border-bottom: none; opacity: 0.7; }
        
        .btn-free { background: #8b5cf6; grid-column: span 2; font-size: 14px; }
        .btn-pay { background: #10b981; }
        .btn-warn { background: #f59e0b; }

        #takeBtn { background: var(--yellow); color: var(--dark); grid-column: span 2; display: none; font-size: 22px; padding: 18px; animation: pulse 1.5s infinite; border-bottom: 6px solid #d97706; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .history-panel { margin-top: 15px; background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid #334155; }
        .history-list { display: flex; flex-direction: column-reverse; gap: 6px; max-height: 100px; overflow-y: auto; margin-top: 8px; }
        .hist-item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 10px; font-size: 12px; }
        .hist-win { color: #10b981; font-weight: bold; }
        .hist-crash { color: #f43f5e; font-weight: bold; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 0; border-top: 1px solid #334155; z-index: 100; }
        .nav-item { background: none; border: none; color: #94a3b8; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--sky); }
        .nav-icon { font-size: 20px; }

        .cloud { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: move linear infinite; filter: blur(1px); }
        .star-fx { position: absolute; font-size: 24px; animation: collect 0.6s ease-out forwards; z-index: 5; }
        @keyframes collect { 0% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: translate(-150px, -50px) scale(0.5); } }
        .boom { font-size: 80px; position: absolute; z-index: 100; animation: boom-anim 0.5s ease-out forwards; }
        @keyframes boom-anim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

    <audio id="snd_pop" src="https://www.soundjay.com/buttons/sounds/button-37a.mp3"></audio>
    <audio id="snd_crash" src="https://www.soundjay.com/misc/sounds/explosion-01.mp3"></audio>

    <div class="header-panel">
        <div class="stats-grid">
            <div class="stat-box"><div class="label">Кошелек</div><div class="val"><span id="bal">0</span> ⭐</div></div>
            <div class="stat-box"><div class="label">В полете</div><div class="val" style="color:white"><span id="win">0</span> ⭐</div></div>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
            <div class="progress-text">ДО ВЫВОДА: <span id="prog-val">0</span> / 1000 ⭐</div>
        </div>
    </div>

    <div id="scene">
        <div id="multiplier">x1.00</div>
        <div id="gain-float">+0</div>
        <div id="bird-wrap"><div id="bird">🐦‍⬛</div></div>
    </div>

    <div class="grid-btns" id="controls">
        <button id="btn-free" class="btn btn-free" onclick="fly(0, 'free')">🚀 БЕСПЛАТНЫЙ ПОЛЕТ</button>
        <button id="btn-spin" class="btn btn-pay" onclick="fly(50, 'spin')">🎰 СПИН (50 ⭐)</button>
        <button id="btn-turbo" class="btn btn-pay" style="background:#059669" onclick="fly(300, 'turbo')">🔥 ТУРБО (300 ⭐)</button>
        <button id="btn-energy" class="btn btn-warn" onclick="fly(25, 'energy')">⚡ ЭНЕРГИЯ (25 ⭐)</button>
    </div>

    <button id="takeBtn" class="btn" onclick="take()">💰 ЗАБРАТЬ ⭐</button>

    <div class="history-panel">
        <div class="label" style="text-align: left;">Последние полеты</div>
        <div id="hist-list" class="history-list"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active"><span class="nav-icon">🎮</span>Игра</button>
        <button class="nav-item" onclick="tg.showAlert('Магазин скоро откроется!')"><span class="nav-icon">🛒</span>Магазин</button>
        <button class="nav-item" onclick="showFriends()"><span class="nav-icon">👥</span>Друзья</button>
        <button class="nav-item" onclick="tg.showAlert('Лига в разработке')"><span class="nav-icon">🏆</span>Лига</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API = "https://humanity-built-follow-hamilton.trycloudflare.com"; 
        const userId = tg.initDataUnsafe.user?.id || 12345;
        
        let balance = 0, flightWin = 0, isGaming = false, seconds = 0;
        let alreadyTaken = false, currentMult = 1.0;
        let crashAfterTake = 0;

        function updateCooldowns() {
            const now = Date.now();
            const btnFree = document.getElementById('btn-free');
            const freeLast = localStorage.getItem('free_cooldown') || 0;
            const freeLeft = (8 * 3600 * 1000) - (now - freeLast);
            
            if (freeLeft > 0) {
                btnFree.disabled = true;
                btnFree.innerText = `⏳ ${new Date(freeLeft).toISOString().substr(11, 5)}`;
            } else {
                btnFree.disabled = false;
                btnFree.innerText = `🚀 БЕСПЛАТНЫЙ ПОЛЕТ`;
            }

            const payLast = localStorage.getItem('pay_cooldown') || 0;
            const payLeft = 30000 - (now - payLast);
            ['btn-spin', 'btn-turbo', 'btn-energy'].forEach(id => {
                const b = document.getElementById(id);
                if (payLeft > 0) { 
                    b.disabled = true; 
                    b.innerText = `😴 ОТДЫХ ${Math.ceil(payLeft/1000)}с`;
                } else { 
                    b.disabled = false; 
                    if(id === 'btn-spin') b.innerText = '🎰 СПИН (50 ⭐)';
                    if(id === 'btn-turbo') b.innerText = '🔥 ТУРБО (300 ⭐)';
                    if(id === 'btn-energy') b.innerText = '⚡ ЭНЕРГИЯ (25 ⭐)';
                }
            });
        }

        function spawnStar() {
            const s = document.createElement('div');
            s.className = 'star-fx'; s.innerText = '⭐';
            s.style.top = document.getElementById('bird-wrap').style.top;
            s.style.right = '40px';
            document.getElementById('scene').appendChild(s);
            document.getElementById('snd_pop').currentTime = 0;
            document.getElementById('snd_pop').play();
            setTimeout(() => s.remove(), 600);
        }

        function addHistory(winAmount, mult) {
            const list = document.getElementById('hist-list');
            const item = document.createElement('div');
            item.className = 'hist-item';
            const statusClass = winAmount > 0 ? 'hist-win' : 'hist-crash';
            item.innerHTML = `<span>${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                              <span class="${statusClass}">${winAmount > 0 ? '+'+winAmount+'⭐' : 'КРАШ'}</span>
                              <span>x${mult.toFixed(2)}</span>`;
            list.prepend(item);
        }

        function fly(cost, type) {
            if (cost > balance && type !== 'free') {
                tg.showAlert(`Недостаточно звезд! У тебя ${balance}`); return;
            }
            if (type === 'free') localStorage.setItem('free_cooldown', Date.now());
            else localStorage.setItem('pay_cooldown', Date.now());
            
            updateCooldowns();
            start(cost, type);
        }

        function start(cost, type) {
            isGaming = true; seconds = 0; flightWin = 0; currentMult = 1.0; alreadyTaken = false; crashAfterTake = 0;
            if (type !== 'free') balance -= cost;
            updateUI();
            
            document.getElementById('controls').style.display = 'none';
            document.getElementById('takeBtn').style.display = 'block';
            document.getElementById('takeBtn').innerText = "💰 ЗАБРАТЬ ⭐";
            document.getElementById('takeBtn').style.opacity = "1";
            document.getElementById('multiplier').style.display = 'block';

            window.timer = setInterval(() => {
                seconds += 0.5;
                
                // Если уже нажали "Забрать", считаем время до искусственного краша
                if (alreadyTaken) {
                    crashAfterTake += 0.5;
                    currentMult += 0.2;
                    document.getElementById('multiplier').innerText = `x${currentMult.toFixed(2)}`;
                    document.getElementById('bird-wrap').style.top = (20 + Math.random()*50) + '%';
                    if (crashAfterTake >= (4 + Math.random() * 4)) {
                        clearInterval(window.timer);
                        end();
                    }
                    return;
                }

                let crashChance = seconds * 0.14;
                if (Math.random() < crashChance) {
                    clearInterval(window.timer);
                    end();
                } else {
                    currentMult += 0.15;
                    let base = (type === 'free' ? 5 : (type === 'energy' ? 10 : cost/2));
                    let val = Math.floor(base * 0.2); 
                    flightWin = Math.floor(base * currentMult);
                    
                    document.getElementById('win').innerText = flightWin;
                    document.getElementById('multiplier').innerText = `x${currentMult.toFixed(2)}`;
                    document.getElementById('bird-wrap').style.top = (20 + Math.random()*50) + '%';
                    
                    const gf = document.getElementById('gain-float');
                    gf.innerText = `+${val}`; gf.style.display = 'block';
                    setTimeout(() => gf.style.display = 'none', 400);
                    
                    spawnStar();
                    tg.HapticFeedback.impactOccurred('light');
                }
            }, 500);
        }

        function take() {
            if (alreadyTaken) return;
            alreadyTaken = true;
            balance += flightWin;
            updateUI();
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById('takeBtn').style.opacity = "0.7";
            document.getElementById('takeBtn').innerText = "🐦 ПТИЧКА ЛЕТИТ...";
        }

        async function end() {
            isGaming = false;
            const finalWin = alreadyTaken ? flightWin : 0;
            addHistory(finalWin, currentMult);

            const b = document.createElement('div');
            b.className = 'boom'; b.innerText = '💥';
            b.style.left = '40px'; b.style.top = document.getElementById('bird-wrap').style.top;
            document.getElementById('scene').appendChild(b);
            document.getElementById('snd_crash').play();
            if (!alreadyTaken) tg.HapticFeedback.notificationOccurred('error');
            setTimeout(() => b.remove(), 500);

            document.getElementById('controls').style.display = 'grid';
            document.getElementById('takeBtn').style.display = 'none';
            document.getElementById('multiplier').style.display = 'none';
            document.getElementById('win').innerText = 0;

            updateUI();
            syncBalance();
        }

        async function syncBalance() {
            try {
                await fetch(`${API}/update_balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, balance: balance })
                });
            } catch (e) {}
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance;
            let prog = Math.min(100, (balance / 1000) * 100);
            document.getElementById('progress-bar').style.width = prog + '%';
            document.getElementById('prog-val').innerText = balance;
        }

        function showFriends() {
            tg.showAlert(`Твой ID: ${userId}\nДрузья сохраняются в базе данных.`);
        }

        function createClouds() {
            for(let i=0; i<6; i++){
                let c = document.createElement('div');
                c.className = 'cloud';
                c.style.cssText = `width:${40+Math.random()*60}px; height:20px; top:${Math.random()*200}px; right:-100px; animation: move ${5+Math.random()*7}s linear infinite;`;
                document.getElementById('scene').appendChild(c);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes move { from { right: -100px; } to { right: 110%; } }`;
        document.head.appendChild(style);

        createClouds();
        setInterval(updateCooldowns, 1000);
        fetch(`${API}/get_user?user_id=${userId}`).then(r => r.json()).then(d => { balance = parseInt(d.balance) || 0; updateUI(); });
    </script>
</body>
</html>
