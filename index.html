<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Bird: Lucky Spin 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --yellow: #fcd34d; --blue: #3b82f6; --sky: #0ea5e9; --red: #f43f5e; --dark: #020617; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 10px; overflow: hidden; touch-action: manipulation; user-select: none; }
        
        .header-panel { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; padding: 15px; margin-bottom: 5px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 22px; font-weight: 800; color: var(--yellow); text-shadow: 0 0 10px rgba(252, 211, 77, 0.3); }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .progress-container { background: #1e293b; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; border: 1px solid #334155; position: relative; }
        #progress-bar { background: var(--blue); width: 0%; height: 100%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--blue); }
        .progress-text { font-size: 9px; color: white; position: absolute; width: 100%; top: 0; left: 0; line-height: 12px; font-weight: bold; }

        #scene { position: relative; width: 100%; height: 280px; background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 100%); border-radius: 24px; overflow: hidden; margin-bottom: 15px; border: 4px solid #1e293b; box-shadow: inset 0 0 50px rgba(0,0,0,0.2); transition: transform 0.1s; }
        #bird-wrap { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); z-index: 10; transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #bird { font-size: 55px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); display: inline-block; animation: wing 0.4s infinite alternate; }
        @keyframes wing { from { transform: scaleX(-1) rotate(-5deg); } to { transform: scaleX(-1) rotate(5deg); } }
        
        #multiplier { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; color: var(--yellow); border: 1px solid var(--yellow); display: none; z-index: 20; }
        #gain-float { position: absolute; right: 20px; top: 20px; color: var(--yellow); font-weight: bold; font-size: 20px; display: none; z-index: 25; }

        .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 12px; border: none; border-radius: 18px; font-weight: bold; color: white; cursor: pointer; transition: 0.1s; border-bottom: 5px solid rgba(0,0,0,0.3); font-size: 11px; text-transform: uppercase; }
        .btn:active { transform: translateY(3px); border-bottom: none; }
        
        .btn-free { background: #8b5cf6; grid-column: span 2; font-size: 14px; }
        .btn-pay { background: #10b981; }
        .btn-warn { background: #f59e0b; }
        .btn-soon { background: #334155; color: #94a3b8; }

        #takeBtn { background: #fcd34d; color: #020617; grid-column: span 2; display: none; font-size: 22px; padding: 20px; animation: pulse 1.5s infinite; border-bottom: 6px solid #d97706; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .cloud { position: absolute; background: white; border-radius: 50%; opacity: 0.6; animation: move linear infinite; filter: blur(2px); }
        .star-fx { position: absolute; font-size: 24px; animation: collect 0.6s ease-out forwards; z-index: 5; }
        @keyframes collect { 0% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: translate(-150px, -50px) scale(0.5); } }
        
        .boom { font-size: 80px; position: absolute; z-index: 100; animation: boom-anim 0.5s ease-out forwards; }
        @keyframes boom-anim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stats-grid">
            <div class="stat-box"><div class="label">Кошелек</div><div class="val"><span id="bal">0</span> ⭐</div></div>
            <div class="stat-box"><div class="label">В полете</div><div class="val" style="color:white"><span id="win">0</span> ⭐</div></div>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
            <div class="progress-text">ДО ВЫВОДА: <span id="prog-val">0</span> / 1000 ⭐</div>
        </div>
    </div>

    <div id="scene">
        <div id="multiplier">x1.00</div>
        <div id="gain-float">+0</div>
        <div id="bird-wrap"><div id="bird">🐦‍⬛</div></div>
    </div>

    <div class="grid-btns" id="controls">
        <button class="btn btn-free" onclick="fly(0, 'free')">🚀 БЕСПЛАТНЫЙ ПОЛЕТ</button>
        <button class="btn btn-pay" onclick="fly(50, 'spin')">🎰 СПИН (50 ⭐)</button>
        <button class="btn btn-pay" onclick="fly(150, 'super')">💎 СУПЕР (150 ⭐)</button>
        <button class="btn btn-pay" style="background:#059669" onclick="fly(300, 'turbo')">🔥 ТУРБО (300 ⭐)</button>
        <button class="btn btn-warn" onclick="fly(25, 'energy')">⚡ ЭНЕРГИЯ (25 ⭐)</button>
        <button class="btn btn-soon" onclick="tg.close()">👫 ДРУЗЬЯ</button>
        <button class="btn btn-soon">🏆 ЛИГА (СКОРО)</button>
        <button class="btn btn-soon">🛒 МАГАЗИН (СКОРО)</button>
        <button class="btn btn-soon">📦 КЕЙСЫ (СКОРО)</button>
    </div>

    <button id="takeBtn" class="btn" onclick="take()">💰 ЗАБРАТЬ ⭐</button>

    <audio id="snd_pop" src="https://www.soundjay.com/buttons/sounds/button-37a.mp3"></audio>
    <audio id="snd_crash" src="https://www.soundjay.com/misc/sounds/explosion-01.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API = "http://85.198.96.191:8080"; // Твой IP
        const userId = new URLSearchParams(window.location.search).get('user_id') || tg.initDataUnsafe.user?.id || 12345;
        
        let balance = 0, flightWin = 0, isGaming = false, seconds = 0;

        async function sync() {
            try {
                const res = await fetch(`${API}/get_user?user_id=${userId.toString()}&t=${Date.now()}`);
                const d = await res.json();
                if(d.balance !== undefined) {
                    balance = parseInt(d.balance);
                    updateUI();
                }
            } catch (e) { console.error("Sync failed"); }
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance;
            let prog = Math.min(100, (balance / 1000) * 100);
            document.getElementById('progress-bar').style.width = prog + '%';
            document.getElementById('prog-val').innerText = balance;
        }

        function fly(cost, type) {
            if (cost > balance && type !== 'free') {
                tg.showAlert(`Недостаточно звезд! У тебя ${balance}, нужно ${cost}.`);
                return;
            }
            start(cost, type);
        }

        function getStarValue(sec, type) {
            const r = Math.random() * 100;
            if (type === 'free') {
                if (sec < 2) return r < 75 ? 1 : 2;
                if (sec < 3) return r < 60 ? 3 : 5;
                return 5;
            }
            if (type === 'spin') return Math.floor(Math.random() * 10) + 5;
            if (type === 'super') return Math.floor(Math.random() * 20) + 10;
            if (type === 'turbo') return Math.floor(Math.random() * 50) + 20;
            return 1;
        }

        function start(cost, type) {
            isGaming = true; seconds = 0; flightWin = 0;
            if (type !== 'free') balance -= cost;
            
            updateUI();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('takeBtn').style.display = 'block';
            document.getElementById('multiplier').style.display = 'block';

            let m = 1.0;
            window.timer = setInterval(() => {
                seconds += 0.5;
                let crashChance = seconds * 0.15;
                if (Math.random() < crashChance) {
                    clearInterval(window.timer);
                    end(false);
                } else {
                    m += 0.15;
                    let val = getStarValue(seconds, type);
                    flightWin += val;
                    document.getElementById('win').innerText = flightWin;
                    document.getElementById('multiplier').innerText = `x${m.toFixed(2)}`;
                    const gf = document.getElementById('gain-float');
                    gf.innerText = `+${val}`; gf.style.display = 'block';
                    setTimeout(() => gf.style.display = 'none', 400);
                    document.getElementById('bird-wrap').style.top = (20 + Math.random()*50) + '%';
                    spawnStar();
                    document.getElementById('snd_pop').play();
                    tg.HapticFeedback.impactOccurred('light');
                }
            }, 500);
        }

        function take() {
            clearInterval(window.timer);
            balance += flightWin;
            end(true);
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ END - ВСЯ ЛОГИКА ТУТ
        async function end(win) {
            isGaming = false;
            
            // Сохраняем твой визуал взрыва
            if(!win) {
                flightWin = 0;
                const b = document.createElement('div');
                b.className = 'boom'; b.innerText = '💥';
                b.style.left = '50px'; b.style.top = document.getElementById('bird-wrap').style.top;
                document.getElementById('scene').appendChild(b);
                document.getElementById('snd_crash').play();
                tg.HapticFeedback.notificationOccurred('error');
                setTimeout(() => b.remove(), 500);
            } else {
                tg.HapticFeedback.notificationOccurred('success');
            }

            // Возвращаем интерфейс
            document.getElementById('controls').style.display = 'grid';
            document.getElementById('takeBtn').style.display = 'none';
            document.getElementById('multiplier').style.display = 'none';
            document.getElementById('win').innerText = 0;

            // 1. Обновляем UI сразу
            updateUI();
            
            // 2. Отправляем на сервер (исправленный формат)
            const payload = {
                user_id: userId.toString().trim(),
                balance: balance
            };

            try {
                await fetch(`${API}/update_balance`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                    keepalive: true 
                });
                console.log("Saved to server");
                // Можно добавить маленькую подсказку, что сохранено
                tg.MainButton.setText("⭐ БАЛАНС ОБНОВЛЕН").show();
                setTimeout(() => tg.MainButton.hide(), 1500);
            } catch (e) { 
                console.error("Save failed");
            }
            
            // 3. Контрольный синхрон через секунду
            setTimeout(sync, 1000);
        }

        function spawnStar() {
            const s = document.createElement('div');
            s.className = 'star-fx'; s.innerText = '⭐';
            s.style.top = document.getElementById('bird-wrap').style.top;
            s.style.right = '40px';
            document.getElementById('scene').appendChild(s);
            setTimeout(() => s.remove(), 600);
        }

        function createClouds() {
            const sc = document.getElementById('scene');
            for(let i=0; i<6; i++){
                let c = document.createElement('div');
                c.className = 'cloud';
                c.style.width = (40 + Math.random()*60) + 'px';
                c.style.height = '20px';
                c.style.top = (Math.random()*200) + 'px';
                c.style.right = '-100px';
                c.style.animation = `move ${(4 + Math.random()*8)}s linear infinite`;
                sc.appendChild(c);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes move { from { right: -100px; } to { right: 110%; } }`;
        document.head.appendChild(style);

        createClouds();
        sync();
    </script>
</body>
</html>
