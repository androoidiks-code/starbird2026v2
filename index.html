<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Bird: Lucky Spin 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --yellow: #fcd34d; --blue: #3b82f6; --sky: #0ea5e9; --red: #f43f5e; --dark: #020617; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding: 10px; overflow: hidden; touch-action: manipulation; user-select: none; }
        
        /* Хедер */
        .header-panel { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 22px; font-weight: 800; color: var(--yellow); text-shadow: 0 0 10px rgba(252, 211, 77, 0.3); }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        /* Арена */
        #scene { position: relative; width: 100%; height: 280px; background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 100%); border-radius: 24px; overflow: hidden; margin-bottom: 15px; border: 4px solid #1e293b; box-shadow: inset 0 0 50px rgba(0,0,0,0.2); }
        #bird-wrap { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); z-index: 10; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #bird { font-size: 55px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); display: inline-block; animation: wing 0.4s infinite alternate; }
        @keyframes wing { from { transform: scaleX(-1) rotate(-5deg); } to { transform: scaleX(-1) rotate(5deg); } }
        #multiplier { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; color: var(--yellow); border: 1px solid var(--yellow); display: none; z-index: 20; }

        /* Кнопки */
        .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 18px; font-weight: bold; color: white; cursor: pointer; transition: 0.1s; border-bottom: 5px solid rgba(0,0,0,0.3); font-size: 12px; text-transform: uppercase; }
        .btn:active { transform: translateY(3px); border-bottom: none; }
        
        .btn-free { background: #8b5cf6; grid-column: span 2; font-size: 14px; position: relative; }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; font-size: 8px; padding: 2px 6px; border-radius: 10px; }
        .btn-pay { background: #10b981; }
        .btn-warn { background: #f59e0b; }
        .btn-soon { background: #334155; color: #64748b; }

        #takeBtn { background: #fcd34d; color: #020617; grid-column: span 2; display: none; font-size: 22px; padding: 20px; animation: pulse 1.5s infinite; border-bottom: 6px solid #d97706; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); box-shadow: 0 0 20px var(--yellow); } 100% { transform: scale(1); } }

        .cloud { position: absolute; background: white; border-radius: 50%; opacity: 0.6; animation: move linear infinite; filter: blur(2px); }
        .star-fx { position: absolute; font-size: 24px; animation: collect 0.8s ease-out forwards; z-index: 5; }
        @keyframes collect { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-100px, -50px) scale(0.5); } }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stats-grid">
            <div class="stat-box"><div class="label">Твой Кошелек</div><div class="val"><span id="bal">0</span> ⭐</div></div>
            <div class="stat-box"><div class="label">В полете</div><div class="val" style="color:white"><span id="win">0</span> ⭐</div></div>
        </div>
    </div>

    <div id="scene">
        <div id="multiplier">x1.00</div>
        <div id="bird-wrap"><div id="bird">🐦‍⬛</div></div>
    </div>

    <div class="grid-btns" id="controls">
        <button class="btn btn-free" onclick="fly(0, 'free')">
            🚀 БЕСПЛАТНЫЙ ПОЛЕТ
            <span class="badge">TEST</span>
        </button>
        <button class="btn btn-pay" onclick="fly(50, 'spin')">🎰 СПИН (50 ⭐)</button>
        <button class="btn btn-pay" onclick="fly(150, 'super')">💎 СУПЕР (150 ⭐)</button>
        <button class="btn btn-pay" style="background:#059669" onclick="fly(300, 'turbo')">🔥 ТУРБО (300 ⭐)</button>
        <button class="btn btn-warn" onclick="fly(25, 'energy')">⚡ ЭНЕРГИЯ (25 ⭐)</button>
        <button class="btn btn-soon">👫 ДРУЗЬЯ</button>
        <button class="btn btn-soon">🏆 ЛИГИ</button>
        <button class="btn btn-soon">🎁 БОНУС</button>
    </div>

    <button id="takeBtn" class="btn" onclick="take()">💰 ЗАБРАТЬ ⭐</button>

    <audio id="snd_pop" src="https://www.soundjay.com/buttons/sounds/button-37a.mp3"></audio>
    <audio id="snd_crash" src="https://www.soundjay.com/free-music/sounds/fail-trumpet-01.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const API = "http://85.198.96.191:8080";
        const PROXY = "https://api.allorigins.win/get?url=";
        const userId = tg.initDataUnsafe.user?.id || 12345;
        
        let balance = 0, flightWin = 0, isGaming = false;

        async function apiReq(end, params) {
            const url = `${API}/${end}?${params}&t=${Date.now()}`;
            try {
                const res = await fetch(PROXY + encodeURIComponent(url));
                const data = await res.json();
                return JSON.parse(data.contents);
            } catch (e) { return null; }
        }

        async function sync() {
            const d = await apiReq('get_user', `user_id=${userId}`);
            if(d) {
                balance = d.balance;
                document.getElementById('bal').innerText = balance;
            }
        }

        function fly(cost, type) {
            if (type === 'free') {
                // Логика 8 часов будет тут. Пока - безлимит.
                start(0, true);
                return;
            }

            if(cost > balance) {
                tg.showConfirm(`У тебя ${balance} ⭐. Нужно еще ${cost - balance} ⭐. Перейти в кабинет для пополнения?`, (ok) => {
                    if(ok) tg.close();
                });
                return;
            }
            start(cost, false);
        }

        function start(cost, isFree) {
            isGaming = true;
            if(!isFree) balance -= cost;
            
            flightWin = 0;
            document.getElementById('bal').innerText = balance;
            document.getElementById('controls').style.display = 'none';
            document.getElementById('takeBtn').style.display = 'block';
            document.getElementById('multiplier').style.display = 'block';

            let m = 1.0;
            window.timer = setInterval(() => {
                if(Math.random() < 0.12) {
                    clearInterval(window.timer);
                    end(false);
                } else {
                    m += 0.07;
                    // Если полет бесплатный, даем меньше звезд
                    let gain = isFree ? 2 : Math.floor(cost * 0.12 * m);
                    flightWin += Math.max(1, gain);
                    
                    document.getElementById('win').innerText = flightWin;
                    document.getElementById('multiplier').innerText = `x${m.toFixed(2)}`;
                    document.getElementById('bird-wrap').style.top = (30 + Math.random()*40) + '%';
                    spawnStar();
                    document.getElementById('snd_pop').play();
                    tg.HapticFeedback.impactOccurred('light');
                }
            }, 800);
        }

        function take() {
            clearInterval(window.timer);
            balance += flightWin;
            end(true);
        }

        async function end(win) {
            isGaming = false;
            document.getElementById('controls').style.display = 'grid';
            document.getElementById('takeBtn').style.display = 'none';
            document.getElementById('multiplier').style.display = 'none';
            
            if(!win) {
                document.getElementById('snd_crash').play();
                tg.showAlert("💥 БА-БАХ! Птица упала.");
                tg.HapticFeedback.notificationOccurred('error');
            } else {
                tg.HapticFeedback.notificationOccurred('success');
            }

            await fetch(`${API}/update_balance`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, balance: balance})
            });
            
            flightWin = 0;
            document.getElementById('win').innerText = 0;
            sync();
        }

        function spawnStar() {
            const s = document.createElement('div');
            s.className = 'star-fx'; s.innerText = '⭐';
            s.style.top = (30 + Math.random()*40) + '%';
            s.style.right = '40px';
            document.getElementById('scene').appendChild(s);
            setTimeout(() => s.remove(), 800);
        }

        function createClouds() {
            const sc = document.getElementById('scene');
            for(let i=0; i<6; i++){
                let c = document.createElement('div');
                c.className = 'cloud';
                c.style.width = (40 + Math.random()*60) + 'px';
                c.style.height = '20px';
                c.style.top = (Math.random()*200) + 'px';
                c.style.right = '-100px';
                c.style.animationDuration = (4 + Math.random()*8) + 's';
                c.style.animationDelay = (Math.random()*5) + 's';
                sc.appendChild(c);
            }
        }

        createClouds();
        sync();
    </script>
</body>
</html>
